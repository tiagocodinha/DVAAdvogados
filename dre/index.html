<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Diário da República – Série I</title>

  <!-- O teu CSS geral -->
  <link rel="stylesheet" href="../styles.css">

  <!-- Estilos só para a página DRE -->
  <style>
    .dre-hero {
      padding: 4rem 0 2rem;
      text-align: center;
    }
    .dre-title {
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--primary);
      font-weight: 800;
      margin-bottom: .5rem;
      line-height: 1.15;
    }
    .dre-sub {
      color: var(--muted-foreground);
      font-size: .95rem;
    }
    .dre-sub strong { color: var(--foreground); }

    .dre-list {
      max-width: 980px;
      margin: 2rem auto 5rem;
      display: grid;
      gap: 1rem;
      padding: 0 1rem;
    }

    .dre-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: .6rem;
      box-shadow: var(--shadow-card);
      padding: 1.25rem 1.25rem 1.1rem;
      transition: var(--transition);
    }
    .dre-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

    .dre-doc-title {
      font-family: 'Roboto Slab', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: .55rem;
      line-height: 1.5;
    }
    .dre-summary {
      color: var(--foreground);
      line-height: 1.7;
      font-size: 1rem;
    }

    .dre-loading, .dre-error {
      text-align: center;
      margin: 3rem 0 5rem;
      color: var(--muted-foreground);
    }
    .dre-error { color: #b00020; }

    /* mini skeleton */
    .skeleton {
      border-radius: .5rem;
      background: linear-gradient(90deg, #eee 25%, #f6f6f6 37%, #eee 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s infinite;
      height: 82px;
      border: 1px solid var(--border);
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    /* separador visual da data */
    .dre-divider {
      width: 72px; height: 4px;
      margin: 1rem auto 2rem;
      background: var(--gradient-accent);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="dre-hero">
      <h1 class="dre-title">Diário da República – Série I</h1>
      <p class="dre-sub" id="dre-meta">Sumários atualizados automaticamente</p>
      <div class="dre-divider"></div>
    </header>

    <!-- Estado de carregamento -->
    <section class="dre-list" id="dre-list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <p class="dre-error" id="dre-error" style="display:none">
      Erro ao carregar os sumários. Tenta novamente mais tarde.
    </p>
  </main>

  <script>
    (async () => {
      const listEl = document.getElementById('dre-list');
      const metaEl = document.getElementById('dre-meta');
      const errEl  = document.getElementById('dre-error');

      // candidatos locais (mesmo domínio). O primeiro deve bastar.
      const jsonCandidates = [
        'https://dvaadvogados.pt/dre-sumarios.json?' + Date.now(), // domínio principal
        '/dre-sumarios.json?' + Date.now(),                         // local (fallback)
      ];
 

      function pickDateFromDisplay(display) {
        // Procura AAAA-MM-DD no início do display
        const m = String(display).match(/^(\d{4}-\d{2}-\d{2})/);
        return m ? m[1] : null;
      }

      async function loadJson() {
        let lastErr;
        for (const url of jsonCandidates) {
          try {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
            return await r.json();
          } catch (e) { lastErr = e; }
        }
        throw lastErr || new Error('Sem dados');
      }

      function render(data) {
        const items = Array.isArray(data?.items) ? data.items : [];

        // Meta (data do dia e hora atualização)
        const firstDisplay = items[0]?.display || '';
        const date = pickDateFromDisplay(firstDisplay) || new Date().toISOString().slice(0,10);

        let updated = '';
        if (data?.generated_at) {
          const d = new Date(data.generated_at);
          if (!isNaN(d)) {
            // mostra hora local hh:mm:ss
            updated = d.toLocaleString('pt-PT', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
          }
        }
        metaEl.innerHTML = `Dia: <strong>${date}</strong>${updated ? ` &nbsp;•&nbsp; Atualizado: ${updated}` : ''}`;

        // Limpa skeletons
        listEl.innerHTML = '';

        // Constrói cartões
        items.forEach((it) => {
          const display = String(it.display || '').trim();

          // Divide em "título" (1.ª linha) + "sumário" (resto)
          const parts = display.split(/\n+/);
          const titleLine = (parts[0] || '').replace(/^\d{4}-\d{2}-\d{2}\s*-\s*/, ''); // remove data inicial
          const summary   = (parts.slice(1).join(' ') || '').trim();

          // cartão (sem links externos)
          const card = document.createElement('article');
          card.className = 'dre-card fade-in';
          card.innerHTML = `
            <h3 class="dre-doc-title">${escapeHtml(titleLine)}</h3>
            ${summary ? `<p class="dre-summary">${escapeHtml(summary)}</p>` : ''}
          `;
          listEl.appendChild(card);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      try {
        const data = await loadJson();
        if (!data || !Array.isArray(data.items) || !data.items.length) {
          throw new Error('Sem itens');
        }
        render(data);
      } catch (err) {
        // mostra erro
        listEl.innerHTML = '';
        errEl.style.display = 'block';
        // (opcional) detalhar nos devtools
        console.error('DRE:', err);
      }
    })();
  </script>
  
  <!-- no fim do /dre/index.html -->
<script src="/dre/main.js" defer></script>

</body>
</html>
